# ASTRA Analysis Specification — Korean pledges actor-attribution demo
#
# A simplified, runnable slice of a real study: filtering out-of-sample
# Korean forest-policy pledge sentences against a reference corpus. Every
# number quoted below is recomputed live by src/filter_pledges.py from the
# committed data (tests/test_demo_numbers.py enforces this).
#
# The decision this file records is a reversal: the shape-aware Mahalanobis
# metric was the assumed-best choice on theoretical grounds, and was
# excluded after inspection — its retention was implausibly low and the
# quality of the retained set favored the simpler Euclidean filter, which
# the final manuscript adopted. Provenance: internal TRACE record on file,
# session trace_20260509_305aaf (the assumed-Mahalanobis state), and the
# manuscript revision round of 2026-06-11 that directed and verified the
# switch; source records are not published with this artifact.
#
# Constants this demo holds fixed (see README): the threshold rule
# (99th-percentile reference leave-one-out quantile, alpha = 0.01) and the
# location correction (distances measured from the pledge slice's pooled
# centroid, with the reference cluster supplying shape and threshold).
id: korean_pledges_actor_demo
version: "0.0.13"
name: "Korean Pledges Actor-Attribution Demo"
container: python:3.12-slim
description: |
  Decides which of the 218 out-of-sample Forest Bioenergy pledge sentences
  are retained as genuinely belonging to the reference cluster. The
  contested decision is the distance metric: theory favored the
  shape-aware option, the evidence favored the simple one, and a human had
  to rule — which is exactly the judgment the actor layer records.
tags:
  - actor-attribution
  - real-data
  - example

# Who was on this analysis's decisions (RFC-0004 actor layer).
actors:
  oliver:
    type: human
    identifiers: {orcid: "0000-0002-5967-1314"}
  claude_code:
    type: agent
    # Model id supplied by the researcher; the original working sessions
    # predate model-id capture in the provenance record.
    model: claude-opus-4-8
    harness: claude-code
    version: "2026-05"

inputs:
  - id: pledges_subset
    type: data
    source: "data/pledges_subset.csv"
    description: >-
      Complete slice of the 218 out-of-sample pledge sentences assigned to
      the Forest Bioenergy reference cluster (three presidencies; Korean
      text plus 18-d projected coordinates).

  - id: reference_stats
    type: data
    source: "data/reference_stats.npz"
    description: >-
      Derived statistics of the reference planning corpus for this cluster:
      centroid, ridged covariance, and leave-one-out distance
      distributions. No reference text is distributed.

outputs:
  - id: retained_sentences
    type: data
    description: Pledge sentences admitted to the reference cluster.
    decisions: [distance_metric]
    recipe:
      command: >-
        python src/filter_pledges.py --metric {decisions.distance_metric}

  - id: retention_rate
    type: metric
    description: >-
      Share of the 218 sentences retained. Accepted configuration: 161/218
      (73.9%). The excluded, theoretically favored alternative would have
      kept 68/218 (31.2%).
    inputs: [retained_sentences]
    decisions: [distance_metric]
    recipe:
      command: >-
        python src/filter_pledges.py --metric {decisions.distance_metric}

decisions:
  distance_metric:
    label: "Distance metric for cluster membership"
    rationale: >-
      The load-bearing choice, and a reversal of the theoretical prior:
      shape-aware Mahalanobis should be better on paper, but with
      per-cluster covariances estimated from small reference samples in 18
      dimensions, its assumptions did not hold on this corpus. The
      empirical results and a close reading of the retained sentences
      settled the call in favor of the simple metric.
    default: euclidean
    options:
      euclidean:
        label: "Euclidean distance"
        description: >-
          The accepted filter: simple isotropic distance from the pooled
          centroid; retains 161/218 (73.9%) on this cluster, in line with
          plausible retention corpus-wide. Adopted by the final manuscript.
      mahalanobis:
        label: "Mahalanobis distance"
        description: >-
          Shape-aware distance using the reference cluster's ridged
          covariance; retains 68/218 (31.2%) on the same sentences.
        excluded: true
        # exclusion_rationale is the attributed one-line judgment; excluded_reason
        # below is the fuller technical record. Both are part of the schema.
        proposed_by: {actor: claude_code, role: methodology}
        excluded_by: {actor: oliver, role: validation}
        excluded_at: "2026-06-11"
        exclusion_rationale: >-
          The assumed-best option, excluded after inspection: theoretically
          superior shape adaptation, but retention was implausibly low and
          reviewing the retained sentences showed the simple metric was
          producing the better set. Theory needed a human override.
        excluded_reason: >-
          Retains 68/218 (31.2%) vs 161/218 (73.9%) for Euclidean on this
          cluster — less than half the plausible rate, part of a
          corpus-wide pattern of over-rejection under the shape-aware
          metric. The per-cluster covariance behind it is estimated from
          few reference points in 18 dimensions, so the shape it adapts to
          is substantially estimation noise. Review of the retained and
          discarded sentences during manuscript revision confirmed the
          Euclidean set was superior, and the final manuscript adopted
          Euclidean.
